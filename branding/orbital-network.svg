<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <title>Onbora — Le Réseau Orbital</title>
  <!-- Global Web Meridian Outer Ring (Internet-wide presence) -->
  <circle cx="128" cy="128" r="94" stroke="#4F6CE8" stroke-width="22"/>
  <!-- Intersecting global web longitude elliptical orbit -->
  <ellipse cx="128" cy="128" rx="44" ry="94" stroke="#7896FF" stroke-width="18"/>
  <!-- Horizontal web equator band -->
  <line x1="34" y1="128" x2="222" y2="128" stroke="#4F6CE8" stroke-width="16" stroke-linecap="round"/>
  <!-- Central analytical intelligence aperture (focusing the crawl into B2B metric) -->
  <circle cx="128" cy="128" r="18" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="12" fill="#4F6CE8"/>
</svg>