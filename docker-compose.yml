version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: onbora_db
    environment:
      POSTGRES_DB: ${DB_NAME:-onbora_db}
      POSTGRES_USER: ${DB_USER:-onbora_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-onbora_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: onbora_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onbora_backend
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-onbora_db}
      - DB_USER=${DB_USER:-onbora_user}
      - DB_PASSWORD=${DB_PASSWORD:-onbora_pass}
      - REDIS_HOST=redis
      - CORE_AI_URL=http://core_ai:8001/api/v1
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - core_ai

  core_ai:
    build:
      context: ./core-ai
      dockerfile: Dockerfile
    container_name: onbora_core_ai
    volumes:
      - ./core-ai:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onbora_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  pgdata:
